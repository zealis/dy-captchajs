<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 958 1125" role="img" aria-label="Dunyi shield logo">
  <defs>
    <!-- outer rim: light steel-blue at the top, deep navy at the bottom point -->
    <linearGradient id="rim" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#9ccdf0"/>
      <stop offset="0.2" stop-color="#5f9fd2"/>
      <stop offset="0.45" stop-color="#2f639c"/>
      <stop offset="0.72" stop-color="#143a68"/>
      <stop offset="1" stop-color="#081f42"/>
    </linearGradient>
    <linearGradient id="rimShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#03122e" stop-opacity="0"/>
      <stop offset="1" stop-color="#03122e" stop-opacity="0.62"/>
    </linearGradient>
    <!-- top bevel face: near-white on the left, mid blue on the right -->
    <linearGradient id="topL" x1="0" y1="0" x2="0.9" y2="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9f4fd"/>
      <stop offset="1" stop-color="#a5dcf8"/>
    </linearGradient>
    <linearGradient id="topR" x1="0.1" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#6fc2f6"/>
      <stop offset="0.55" stop-color="#3597de"/>
      <stop offset="1" stop-color="#1c6fbc"/>
    </linearGradient>
    <!-- recessed groove channel: a thin dark navy line -->
    <linearGradient id="groove" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#082a63"/>
      <stop offset="0.5" stop-color="#041c4c"/>
      <stop offset="1" stop-color="#020f2e"/>
    </linearGradient>
    <!-- sloped wall between groove and face -->
    <linearGradient id="bevel" x1="0.05" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#37b6f8"/>
      <stop offset="0.35" stop-color="#1b7ed6"/>
      <stop offset="0.7" stop-color="#0258b5"/>
      <stop offset="1" stop-color="#063a75"/>
    </linearGradient>
    <!-- inner face, left half: pale cyan highlight falling to deep blue -->
    <linearGradient id="faceL" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#dcf8fe"/>
      <stop offset="0.16" stop-color="#b9ecfb"/>
      <stop offset="0.34" stop-color="#7cc6f4"/>
      <stop offset="0.52" stop-color="#3790da"/>
      <stop offset="0.7" stop-color="#1063b4"/>
      <stop offset="0.86" stop-color="#074282"/>
      <stop offset="1" stop-color="#052f66"/>
    </linearGradient>
    <!-- inner face, right half: saturated blue, darker than the left -->
    <linearGradient id="faceR" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#54b6f4"/>
      <stop offset="0.2" stop-color="#2596e6"/>
      <stop offset="0.42" stop-color="#1274c6"/>
      <stop offset="0.64" stop-color="#08549e"/>
      <stop offset="0.84" stop-color="#053a78"/>
      <stop offset="1" stop-color="#042a5c"/>
    </linearGradient>
    <linearGradient id="faceShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.66" stop-color="#02183e" stop-opacity="0"/>
      <stop offset="1" stop-color="#02183e" stop-opacity="0.45"/>
    </linearGradient>
    <!-- soft pool of light on the upper-left face -->
    <radialGradient id="hl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#e8fbff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e8fbff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hlR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfeeff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cfeeff" stop-opacity="0"/>
    </radialGradient>
    <!-- diagonal gloss sweep across the lower-left face -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#aee6ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#aee6ff" stop-opacity="0.4"/>
      <stop offset="0.62" stop-color="#aee6ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#aee6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft22" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <!-- one shield outline; every inner layer is a scaled copy, so the
         bands converge toward the bottom point exactly as in the original -->
    <path id="shield" d="M479 4 C575 58 668 96 770 116 C845 131 905 140 940 150 C950 153 953 168 953 205 L954 330 C954 470 940 600 895 720 C845 855 745 985 620 1062 C565 1096 515 1116 479 1123 C443 1116 393 1096 338 1062 C213 985 113 855 63 720 C18 600 4 470 4 330 L5 205 C5 168 8 153 18 150 C53 140 113 131 188 116 C290 96 383 58 479 4 Z"/>
    <clipPath id="clipOuter">
      <use href="#shield"/>
    </clipPath>
    <clipPath id="clipFace">
      <use href="#shield" transform="translate(479 600) scale(0.775 0.79) translate(-479 -600)"/>
    </clipPath>
    <clipPath id="clipLeft">
      <rect x="0" y="0" width="479" height="1125"/>
    </clipPath>
    <clipPath id="clipRight">
      <rect x="479" y="0" width="479" height="1125"/>
    </clipPath>
  </defs>

  <!-- ===== outer rim ===== -->
  <use href="#shield" fill="url(#rim)"/>
  <g clip-path="url(#clipOuter)">
    <rect x="0" y="0" width="958" height="1125" fill="url(#rimShade)"/>
    <!-- darker side wall at the very edge -->
    <use href="#shield" fill="none" stroke="#163d68" stroke-width="14" opacity="0.45"/>
    <!-- sheen down the left rim -->
    <path d="M30 200 L32 620 C33 745 58 855 116 950 L70 972 C28 865 8 745 6 610 L6 240 C6 208 14 194 30 200 Z" fill="#bfe6fa" opacity="0.12" filter="url(#soft22)"/>
    <!-- sheen down the right rim -->
    <path d="M926 205 L928 610 C928 755 904 870 848 962 L890 940 C934 845 950 735 951 605 L951 245 C951 215 943 198 926 205 Z" fill="#7db9e8" opacity="0.16" filter="url(#soft22)"/>
  </g>

  <!-- ===== top bevel face (the 3D top surface of the rim) ===== -->
  <path d="M479 4 C383 58 290 96 188 116 C113 131 53 140 18 150 C38 172 58 186 82 196 C158 172 246 152 336 132 C398 118 448 96 479 76 Z" fill="url(#topL)"/>
  <path d="M479 4 C575 58 668 96 770 116 C845 131 905 140 940 150 C920 172 900 186 876 196 C800 172 712 152 622 132 C560 118 510 96 479 76 Z" fill="url(#topR)"/>
  <!-- specular line along the lower edge of the top face, strongest at left -->
  <path d="M82 196 C158 172 246 152 336 132 C398 118 448 96 479 76" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#soft6)"/>
  <path d="M479 76 C510 96 560 118 622 132 C712 152 800 172 876 196" fill="none" stroke="#bfe9ff" stroke-width="5" stroke-linecap="round" opacity="0.45" filter="url(#soft6)"/>

  <!-- ===== recessed groove: thin dark channel ===== -->
  <use href="#shield" transform="translate(479 600) scale(0.86 0.885) translate(-479 -600)" fill="url(#groove)"/>
  <!-- bright channel line on the groove's right wall -->
  <path d="M872 220 L873 350 C873 458 862 562 826 664" fill="none" stroke="#4db2f2" stroke-width="5" opacity="0.45" filter="url(#soft6)"/>

  <!-- ===== sloped bevel wall ===== -->
  <use href="#shield" transform="translate(479 600) scale(0.815 0.84) translate(-479 -600)" fill="url(#bevel)"/>

  <!-- ===== inner face: two halves split at the centre ridge ===== -->
  <g clip-path="url(#clipLeft)">
    <use href="#shield" transform="translate(479 600) scale(0.775 0.79) translate(-479 -600)" fill="url(#faceL)"/>
  </g>
  <g clip-path="url(#clipRight)">
    <use href="#shield" transform="translate(479 600) scale(0.775 0.79) translate(-479 -600)" fill="url(#faceR)"/>
  </g>
  <g clip-path="url(#clipFace)">
    <!-- pool of light, upper left -->
    <ellipse cx="300" cy="320" rx="225" ry="255" fill="url(#hl)" opacity="0.55"/>
    <!-- faint answering light beside the ridge, right half -->
    <ellipse cx="562" cy="295" rx="145" ry="275" fill="url(#hlR)" opacity="0.5"/>
    <!-- diagonal gloss sweep, lower left -->
    <path d="M100 425 L479 695 L479 1025 L100 1025 Z" fill="url(#gloss)" filter="url(#soft22)"/>
    <!-- deepening shade toward the bottom point -->
    <use href="#shield" transform="translate(479 600) scale(0.775 0.79) translate(-479 -600)" fill="url(#faceShade)"/>
  </g>
  <!-- face lip: bright line where the face meets the bevel -->
  <use href="#shield" transform="translate(479 600) scale(0.775 0.79) translate(-479 -600)" fill="none" stroke="#9fdcfb" stroke-width="6" opacity="0.45"/>

  <!-- ===== centre ridge ===== -->
  <path d="M479 132 L479 1008" stroke="#062a5e" stroke-width="4" opacity="0.45"/>
  <path d="M474 150 L474 620" stroke="#cfeeff" stroke-width="2.5" opacity="0.3"/>
</svg>
